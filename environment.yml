name: lipsync
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10.14
  - pip

  # PyTorch 2.8 is required by WhisperX 3.8.6; install CUDA wheels via pip.
  # (conda pytorch channel lags behind; pip gives exact CUDA variant)
  - pip:
    - torch==2.8.0
    - torchvision==0.23.0
    - torchaudio==2.8.0

    # Computer vision & media
    - opencv-contrib-python==5.0.0.93
    - ffmpeg-python==0.2.0
    - mediapipe==0.10.35

    # Numerical
    - numpy==2.1.3
    - scipy==1.15.3

    # Utilities
    - tqdm==4.67.1
    - pyyaml==6.0.2

    # HuggingFace
    - huggingface_hub==0.36.2
    - transformers==4.48.3
    - accelerate==1.2.1
    - diffusers==0.32.1

    # Audio
    - librosa==0.10.2.post1
    - soundfile==0.12.1
    - g2p_en==2.1.0
    # WhisperX 3.8.6 is available on PyPI; it requires ctranslate2>=4.5.
    - whisperx==3.8.6
    - ctranslate2==4.8.2
    - onnxruntime==1.20.1
    - pyannote-audio==4.0.0
    - torchcodec==0.7.0

    # Testing & dev
    - pytest==8.3.4
    - pytest-cov==6.0.0
    - black==24.10.0
    - isort==5.13.2
    - flake8==7.1.1
